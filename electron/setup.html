<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #2b2d31;
      color: #dbdee1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 32px;
      gap: 20px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    p {
      font-size: 13px;
      color: #949ba4;
      text-align: center;
      line-height: 1.5;
    }

    input {
      width: 100%;
      background: #1e1f22;
      border: 1px solid #1e1f22;
      border-radius: 4px;
      color: #dbdee1;
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #5865f2;
    }

    input::placeholder {
      color: #4e5058;
    }

    button {
      width: 100%;
      background: #5865f2;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #4752c4; }
    button:active { background: #3c45a5; }

    .error {
      font-size: 12px;
      color: #f23f42;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Connect to Server</h1>
  <p>Enter the URL of your Discord Clone server.<br/>You can change this later via File → Change Server URL.</p>
  <input
    id="url"
    type="url"
    placeholder="https://your-server.com"
    autofocus
  />
  <p class="error" id="error"></p>
  <button onclick="connect()">Connect</button>

  <script>
    document.getElementById('url').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connect();
    });

    function connect() {
      const raw = document.getElementById('url').value.trim();
      const err = document.getElementById('error');
      err.textContent = '';

      if (!raw) {
        err.textContent = 'Please enter a server URL.';
        return;
      }

      let url;
      try {
        url = new URL(raw);
        if (!['http:', 'https:'].includes(url.protocol)) throw new Error();
      } catch {
        err.textContent = 'Enter a valid URL starting with http:// or https://';
        return;
      }

      window.electronAPI.setServerUrl(url.href.replace(/\/$/, ''));
    }
  </script>
</body>
</html>
