<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #313338;
      color: #dbdee1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 14px;
      padding: 32px;
      text-align: center;
    }
    h2 { font-size: 20px; color: #fff; }
    #url { background: #1e1f22; color: #f23f42; padding: 6px 14px; border-radius: 4px; font-family: monospace; font-size: 13px; max-width: 100%; overflow-wrap: break-word; }
    #detail { font-size: 13px; color: #949ba4; }
    button {
      background: #5865f2; color: #fff; border: none; border-radius: 4px;
      padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #4752c4; }
  </style>
</head>
<body>
  <h2>Could not connect</h2>
  <div id="url">—</div>
  <div id="detail">—</div>
  <button onclick="location.reload()">Retry</button>
  <script>
    const params = new URLSearchParams(location.search);
    const url = params.get('url');
    const code = params.get('code');
    const desc = params.get('desc');
    if (url) document.getElementById('url').textContent = url;
    if (code || desc) document.getElementById('detail').textContent = `Error ${code}: ${desc}`;
  </script>
</body>
</html>
